<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Data science, applied machine learning, and software engineering."
    />
    <title>Aristo Eng</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="logo" href="#"><span id="logo-text"></span></a>
        <nav class="nav" id="site-nav" aria-label="Primary"></nav>
      </div>
    </header>

    <main id="main">
      <section class="hero">
        <div class="wrap hero-grid">
          <div class="hero-copy">
            <p class="eyebrow" id="hero-eyebrow"></p>
            <h1 class="hero-title" id="hero-title"></h1>
            <p class="hero-lead" id="hero-lead"></p>
            <div class="hero-actions" id="hero-actions"></div>
          </div>
          <div class="hero-panel" aria-hidden="true">
            <div class="panel-inner">
              <div class="code-block" id="hero-code"></div>
            </div>
          </div>
        </div>
      </section>

      <section id="about" class="section about">
        <div class="wrap">
          <h2 class="section-title" id="about-title">About</h2>
          <p class="about-intro" id="about-intro"></p>
          <div class="skill-pills" id="skill-pills" aria-label="Skills and tools"></div>
        </div>
      </section>

      <section id="expertise" class="section expertise">
        <div class="wrap">
          <h2 class="section-title">Expertise</h2>
          <p class="section-intro" id="expertise-intro"></p>
          <div class="cards" id="expertise-cards"></div>
        </div>
      </section>

      <section id="projects" class="section projects">
        <div class="wrap">
          <h2 class="section-title" id="projects-title">Projects</h2>
          <p class="section-intro" id="projects-intro"></p>
          <div class="project-grid" id="project-grid"></div>
        </div>
      </section>

      <section id="contact" class="section contact">
        <div class="wrap contact-inner">
          <h2 class="section-title" id="contact-title">Contact</h2>
          <p class="contact-lead" id="contact-lead"></p>
          <a
            class="btn btn-primary btn-lg"
            id="contact-btn"
            href="https://github.com/Aristo-eng"
            target="_blank"
            rel="noopener noreferrer"
            >GitHub</a
          >
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <p>&copy; <span id="year"></span> <span id="footer-line">Aristo Eng · GitHub Pages</span></p>
      </div>
    </footer>

    <script src="content.js"></script>
    <script src="script.js" defer></script>
  </body>
</html>
